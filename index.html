<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <title>Table de mixage JdR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <button id="retour" class="discret" hidden aria-label="Changer de séance">‹ Séances</button>
    <h1 id="titre">Table de mixage</h1>
    <span id="sous-titre"></span>
  </header>

  <main>
    <!-- Écran de connexion -->
    <section id="ecran-connexion" class="ecran" hidden>
      <p>Connecte tes comptes pour commencer.</p>
      <button id="btn-spotify" class="grand">Connecter Spotify</button>
      <button id="btn-drive" class="grand">Connecter Google Drive</button>
      <p id="config-manquante" class="alerte" hidden>
        Les identifiants Spotify ou Google ne sont pas renseignés dans <code>config.js</code>. Voir le README.
      </p>
    </section>

    <!-- Choix de la séance -->
    <section id="ecran-seances" class="ecran" hidden>
      <h2>Choisis la séance</h2>
      <ul id="liste-seances"></ul>
      <button id="btn-recharger" class="discret">Actualiser la liste</button>
    </section>

    <!-- Table de mixage -->
    <section id="ecran-table" class="ecran" hidden>
      <div id="pads"></div>
      <div id="pad-hors"></div>
    </section>
  </main>

  <footer id="console" hidden>
    <div class="ligne">
      <button id="btn-lecture" class="rond" aria-label="Lecture / pause">⏯</button>
      <button id="btn-suivant" class="rond" aria-label="Morceau suivant">⏭</button>
      <div id="en-cours"><strong id="scene-en-cours">Silence</strong><span id="morceau"></span></div>
    </div>
    <div class="ligne reglages">
      <label>Volume <input id="volume" type="range" min="0" max="100" value="80"><output id="volume-val">80</output></label>
      <label>Fondu <input id="fondu" type="range" min="0" max="10" step="0.5"><output id="fondu-val"></output></label>
      <label>Appareil <select id="appareil"></select></label>
      <button id="btn-appareils" class="discret" aria-label="Actualiser les appareils">↻</button>
      <button id="btn-integre" class="discret" hidden>Activer le lecteur intégré</button>
    </div>
  </footer>

  <div id="message" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="spotify.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
</body>
</html>
